version: 2

updates:
  # The actions in ci.yml are pinned to commit SHAs, which is what stops a moved
  # tag from changing what CI runs — but a pin never expires on its own, so
  # without this the pins quietly rot into unpatched versions. Dependabot bumps
  # the SHA and the `# vX.Y.Z` comment together, as one reviewable diff.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A compromised release is usually caught and pulled within days. Waiting a week
    # keeps it out of a pin, and matches the cooldown in the repo-maintenance skill.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
